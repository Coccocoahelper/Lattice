# Core owns this file; modules add their own sections (maps:, core:, watchdog:, bots:, bedwars:, skywars:).

# Other modules keep their defaults in code and only read optional overrides from their own section.

maps:
  # Tags switched off, e.g. [seasonal] hides every map tagged seasonal and [dreams] the Dreams maps.
  # A map is off when any of its tags is listed here; tags live in each map.yml as tags: [dreams].
  disabled-tags: []

core:
  # Date shown on every scoreboard: MM/dd/yy, or "today" for the real date. In-game: /h2020 date 07/14/20 | today | 2020
  date: "07/14/20"

  # Rank given to real players the first time they join (NONE, VIP, VIP_PLUS, MVP, MVP_PLUS, MVP_PLUS_PLUS, YOUTUBE, ADMIN)
  default-rank: MVP_PLUS
  default-plus-color: RED
  # Network level for new real players
  default-level: 87

  tab:
    header: "&bYou are playing on &e&lMC.HYPIXEL.NET"
    footer: "&bRanks, Boosters & MORE! &c&lSTORE.HYPIXEL.NET"

  # Colour codes use &. Lobby instance number shown on the main lobby scoreboard ("Lobby: #3") and how many lobbies the selector lists.
  lobby-number: 3
  lobby-count: 12

  # Idle bots spawned in each lobby (main, Bed Wars, SkyWars) on enable. The bots-ai module gives them brains.
  lobby-bots: 15

  # Show Hypixel-sized player counts (e.g. "41,233 Players") instead of the real ones on NPCs, menus and scoreboards.
  fake-player-counts: false

  # Bot-only games that run in the background so the network feels alive (0 = off).
  background-games: 0
  background-types: [bedwars_eight_one, bedwars_eight_two, solo_normal, solo_insane]

  bot-fill:
    enabled: true
    # A waiting game fills in a random time between these bounds (seconds), divided by speed.
    min-seconds: 20
    max-seconds: 60
    speed: 1.0
    # Percentage of queue-filler bots that spawn with a cheat profile (0-100).
    cheater-percent: 0
    cheat-types: [KILLAURA, REACH, AUTOCLICKER, FLY, SPEED, SCAFFOLD, VELOCITY, NOFALL, FASTPLACE]

  # What bots do when their game ends: requeue into the same mode, go to the lobby, or disconnect (the rest).
  bot-churn:
    requeue-chance: 0.55
    lobby-chance: 0.25
    # Chance that a bot leaves the game early after its final death / elimination.
    leave-after-elimination: 0.7

  # Game-mode NPCs. Positions are saved here by /h2020 npc <id> (stand where it should be).
  # Skin usernames are fetched from Mojang at startup (empty = borrow a random bot skin).
  npc-skins:
    bedwars: ""
    skywars: ""
  npc-positions: {}

  # Players joining from this machine (localhost) are made op automatically, so you can use /h2020 right away.
  op-local-players: true

  # Melee knockback between players, tuned toward Hypixel 2020 (a little lower and shorter than vanilla 1.8).
  # Vanilla 1.8 is: friction 2.0, horizontal 0.4, vertical 0.4, vertical-limit 0.4, extra-horizontal 0.5,
  # extra-vertical 0.1. "extra" is the sprint-hit / Knockback enchant bonus. enabled: false = vanilla.
  knockback:
    enabled: true
    friction: 2.0
    horizontal: 0.36
    vertical: 0.36
    vertical-limit: 0.4
    extra-horizontal: 0.45
    extra-vertical: 0.085
# Bots module. Everything here is also editable in game with /bot settings (same values, saved back here).
bots:
  # Average skill of newly spawned bots, 0 (complete beginner) .. 1 (sweat).
  # -1 keeps the 2020 public-lobby mix: most players average, a few sweats, a few complete beginners.
  average-skill: -1
  # Bots see other players where they were half a round trip ago, ((their ping + the bot's ping) / 2), and react
  # over that delay - like a client that only has the movement packets that reached it. false = the old behaviour.
  perceived-latency: true
  # Fight-layer behaviours (also switches in /bot settings):
  combat-block-play: true     # stomps, 2-block duel pillars + the strafe around them, middle exits, head hitters
  fireball-play: true         # punch incoming fireballs back, or step off their line
  bed-raid: true              # break a bed that is in reach in the middle of a fight
  # dedicated diagonal bridging: back down the bridge, S-key travel, two blocks per stance.
  # still experimental; the straight bridge handles diagonals while this is false.
  diagonal-stance: false

# Bed Wars tuning. Everything here is optional; the defaults are the 2020 values.
bedwars:
  # How far from its bed a team's island counts as "in base" for the heal pool, traps and building protection.
  island-radius: 12
  # Countdown before a game starts, in seconds.
  countdown: 20
  full-countdown: 10
  respawn-seconds: 5
