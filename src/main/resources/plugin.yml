name: Lattice
version: 1.0.0
main: net.h2020.H2020Plugin
author: h2020
description: Private Hypixel 2020 recreation (Bed Wars, SkyWars, Watchdog, human-like bots)
load: POSTWORLD
commands:
  play:
    description: Join a game, e.g. /play bedwars_eight_one
    usage: /play <game>
  lobby:
    description: Return to lobby
    aliases: [l, hub]
  settings:
    description: Open the settings menu
    usage: /settings
  lattice:
    description: Admin/video tools (bots, games, watchdog)
    aliases: [h2020, lat]
    permission: h2020.admin
  spectate:
    description: Spectate a player, camera locked on them
    usage: /spectate [player]
  shout:
    description: Bed Wars shout chat
  qanswer:
    description: Answer the server's question (also by typing the number in chat)
    usage: /qanswer <id> <option>
permissions:
  h2020.admin:
    description: Admin and video tools
    default: op
  playagain:
    description: Queue for the mode you just finished.
    usage: /playagain
    aliases: [pa]
softdepend: [SwoftyWorldManager, lattice-bots, lattice-skywars, lattice-bedwars, lattice-replay]
