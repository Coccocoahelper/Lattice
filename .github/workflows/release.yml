name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (for example v1.2.3)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Fix permissions
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew --no-daemon build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lattice
          path: |
            build/libs/Lattice.jar
            modules/bots/build/libs/lattice-bots.jar
            modules/bedwars/build/libs/lattice-bedwars.jar
            modules/skywars/build/libs/lattice-skywars.jar
            modules/replay/build/libs/lattice-replay.jar

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: lattice
          path: dist

      - name: Decide release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/Lattice.jar
            dist/lattice-bots.jar
            dist/lattice-bedwars.jar
            dist/lattice-skywars.jar
            dist/lattice-replay.jar
          generate_release_notes: true
